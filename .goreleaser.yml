version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...
    - go build

builds:
  - env:
      - CGO_ENABLED=0
  - id: so_cl
  - main: ./main.go
  - binary: so_cl
  - goos:
      - linux
      - darwin
      - windows
  - goarch:
      - amd64
      - arm64
  - ldflags:
      - -s -w -X main.version={{.Version}} -X main.buildTime={{.CommitDate}}
  - flags:
      - -trimpath

archives:
  - format: tar.gz
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - files:
      - none*

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

release:
  github:
    owner: yourusername
    name: so_cl
  draft: false
  prerelease: auto
  mode: replace

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore"
      - "^ci:"
      - "^refactor:"
